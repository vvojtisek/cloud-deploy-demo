name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  security-and-tests:
    name: Security Scans & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: SAST Scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml

      - name: Credential Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.sha }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Run Unit Tests
        run: npm test

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: audit-records-${{ github.sha }}
          path: |
            test-results.json
            sbom.spdx.json

  build-and-deploy:
    name: Build, Push & Deploy to AWS
    needs: security-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Read application version
        id: app-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cloud-deploy-demo-github-actions-role
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cloud-deploy-demo
          IMAGE_TAG: ${{ github.sha }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          VERSION_TAG="v$APP_VERSION"
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"

      - name: Deploy to ECS Service
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Updating ECS Task Definition..."
          TASK_DEF=$(cat <<EOF
          {
            "family": "cloud-deploy-demo-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::$AWS_ACCOUNT_ID:role/cloud-deploy-demo-ecs-execution-role",
            "containerDefinitions": [
              {
                "name": "app",
                "image": "$ECR_REGISTRY/cloud-deploy-demo:$IMAGE_TAG",
                "portMappings": [{ "containerPort": 8080, "hostPort": 8080 }],
                "environment": [{ "name": "APP_VERSION", "value": "$APP_VERSION" }]
              }
            ]
          }
          EOF
          )

          TASK_REV=$(aws ecs register-task-definition --cli-input-json "$TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)

          # Kontrola zda service existuje, pokud ne -> vytvořit
          if ! aws ecs describe-services --cluster cloud-deploy-demo-cluster --services cloud-deploy-demo-service --query 'services[0].status' --output text | grep -q "ACTIVE"; then
            SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=cloud-deploy-demo-subnet-*" \
              --query 'Subnets | sort_by(@, &AvailabilityZone)[:2].SubnetId' \
              --output text | tr '\t' ',')
            SG=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=cloud-deploy-demo-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
            TG_ARN=$(aws elbv2 describe-target-groups --names cloud-deploy-demo-tg-blue --query "TargetGroups[0].TargetGroupArn" --output text)

            if [ -z "$SUBNETS" ] || [ "$SUBNETS" = "None" ] || [ "$SG" = "None" ] || [ "$TG_ARN" = "None" ]; then
              echo "Required AWS networking resources were not found." >&2
              exit 1
            fi

            aws ecs create-service \
              --cluster cloud-deploy-demo-cluster \
              --service-name cloud-deploy-demo-service \
              --task-definition "$TASK_REV" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=app,containerPort=8080"
          else
            aws ecs update-service \
              --cluster cloud-deploy-demo-cluster \
              --service cloud-deploy-demo-service \
              --task-definition "$TASK_REV" \
              --force-new-deployment
          fi

          aws ecs wait services-stable \
            --cluster cloud-deploy-demo-cluster \
            --services cloud-deploy-demo-service

      - name: Send Telegram Notification
        if: ${{ always() && env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          message: |
            🚀 Deployment Notification
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
